name: SA Banking ETL CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src


  test:
    name: Run Tests
    runs-on: ubuntu-latest

    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest tests/ -v


  integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    needs:
      - test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
          POSTGRES_DB: south_africa_bank

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U bank_user -d south_africa_bank"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create database tables
        env:
          PGPASSWORD: bank_password
        run: |
          psql \
            -h localhost \
            -U bank_user \
            -d south_africa_bank \
            -f database/create_tables.sql

      - name: Create database indexes
        env:
          PGPASSWORD: bank_password
        run: |
          psql \
            -h localhost \
            -U bank_user \
            -d south_africa_bank \
            -f database/indexes.sql


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            sa-banking-etl:latest
            sa-banking-etl:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
